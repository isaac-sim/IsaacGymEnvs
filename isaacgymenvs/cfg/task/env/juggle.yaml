subtask: "juggle"

#evalStats: True  # extra evaluation-time statistics
episodeLength: 300

forceScale: 0.0  # random forces don't allow us to throw precisely so we turn them off

# adds a small pause every time we hit a target
maxConsecutiveSuccesses: 10

withSmallBalls: False
withBigBalls: False

objectType: "ball"

liftingRewScale: 20.0
liftingBonus: 300.0
liftingBonusThreshold: 0.15  # when the object is lifted this distance (in meters) above the table, the agent gets the lifting bonus
distanceDeltaRewScale: 50.0
reachGoalBonus: 1000.0
kukaActionsPenaltyScale: 0.003
allegroActionsPenaltyScale: 0.0003

handDeltaPenaltyScale: 0.0
jugglePenaltyScale: 0.0 #5.0 #removing this term for now (p_1)
juggleRewardScale: 30.0
handHeightPenaltyScale: 100.0
fallPenaltyScale: 5.0
outOfBoundsPenaltyScale: 15.0
hasThrownRewardScale: 20.0 #TODO: return back to reorder
catchingRewardScale: 50.0
upwardHandRewardScale: 50.0

numBalls: 1
juggleMinHeight: 0.6
juggleSuccessHeight: 1.3
handMaxHeight: 0.9
envSpacing: 1.5

hasThrownThreshold: 0.1 #for thrown signal


